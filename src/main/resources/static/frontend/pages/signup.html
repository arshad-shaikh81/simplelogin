<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/pages/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - SimpleLogin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

<main class="page">
    <div class="card">

        <header class="card__header">
            <p class="eyebrow">Get started</p>
            <h1>Create your account</h1>
            <p class="subtitle">Fill in your details to sign up.</p>
        </header>

        <form id="signupForm" novalidate>

            <!-- NAME -->
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" />
                <span class="error" id="name-error" role="alert"></span>
            </div>

            <!-- EMAIL -->
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
                <span class="error" id="email-error" role="alert"></span>
            </div>

            <!-- PASSWORD -->
            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" />
                    <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password">
                        <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-7-11-7a19.28 19.28 0 0 1 4.22-5.5M9.9 4.24A9.7 9.7 0 0 1 12 4c7 0 11 7 11 7a19.35 19.35 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength" aria-hidden="true">
                    <div class="password-strength__bar">
                        <span class="password-strength__fill" id="passwordStrengthFill"></span>
                    </div>
                    <span class="password-strength__label" id="passwordStrengthLabel"></span>
                </div>
                <span class="error" id="password-error" role="alert"></span>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-wrap">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
                    <button type="button" class="toggle-visibility" id="toggleConfirmPassword" aria-label="Show password">
                        <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-7-11-7a19.28 19.28 0 0 1 4.22-5.5M9.9 4.24A9.7 9.7 0 0 1 12 4c7 0 11 7 11 7a19.35 19.35 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
                <span class="error" id="confirmPassword-error" role="alert"></span>
            </div>

            <!-- TERMS -->
            <div class="field field--checkbox">
                <label class="checkbox-option">
                    <input type="checkbox" id="termsAccepted" name="termsAccepted" />
                    <span>I agree to the Terms &amp; Conditions and Privacy Policy.</span>
                </label>
                <span class="error" id="termsAccepted-error" role="alert"></span>
            </div>

            <div class="form-status" id="formStatus" role="status"></div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>
                <span class="btn-label">Create account</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>

            <p class="switch-link">
                Already have an account? <a href="/pages/index.html">Log in</a>
            </p>

        </form>
    </div>
</main>

<script src="/js/signup.js"></script>
</body>
</html>
