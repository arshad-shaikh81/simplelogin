<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/pages/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Simple-Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

<main class="page">
    <div class="card">

        <header class="card__header">
            <p class="eyebrow">Reset password</p>
            <h1>Forgot your password?</h1>
            <p class="subtitle">Enter your registered email and we'll generate a temporary password.</p>
        </header>

        <form id="resetForm" novalidate>

            <!-- EMAIL -->
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
                <span class="error" id="email-error" role="alert"></span>
            </div>

            <div class="form-status" id="formStatus" role="status"></div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>
                <span class="btn-label">Generate temporary password</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>

            <p class="switch-link">
                Remembered your password? <a href="/pages/index.html">Log in</a>
            </p>

        </form>

        <!-- RESULT: shown after a temp password is generated -->
        <div class="field" id="tempPasswordResult" hidden>
            <label for="tempPassword">Your temporary password</label>
            <div class="password-wrap">
                <input type="text" id="tempPassword" readonly />
                <button type="button" class="toggle-visibility" id="copyTempPassword" aria-label="Copy password">
                    <svg class="icon-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    <svg class="icon-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </button>
            </div>
            <span class="hint">Copy this, then paste it into the password field on the login page. Change it once you're logged in.</span>
            <a href="/pages/index.html" class="submit-btn" style="display:block;text-align:center;margin-top:14px;">Go to login</a>
        </div>
    </div>
</main>

<script src="/js/reset-password.js"></script>
</body>
</html>
