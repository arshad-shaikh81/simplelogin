<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SimpleLogin — Secure Auth</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

<main class="page">
    <div class="card">

        <header class="card__header">
            <p class="eyebrow">Welcome back</p>
            <h1>Log in to your account</h1>
            <p class="subtitle">Enter your email and password to continue.</p>
        </header>

        <form id="loginForm" novalidate>

            <!-- EMAIL -->
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
                <span class="error" id="email-error" role="alert"></span>
            </div>

            <!-- PASSWORD -->
            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" />
                    <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password">
                        <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-7-11-7a19.28 19.28 0 0 1 4.22-5.5M9.9 4.24A9.7 9.7 0 0 1 12 4c7 0 11 7 11 7a19.35 19.35 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
                <span class="error" id="password-error" role="alert"></span>
            </div>

            <!-- REMEMBER ME / FORGOT PASSWORD -->
            <div class="field field--checkbox options-row">
                <label class="checkbox-option">
                    <input type="checkbox" id="rememberMe" name="rememberMe" />
                    <span>Remember me</span>
                </label>
                <a href="/pages/reset-password.html" class="forgot-link">Forgot password?</a>
            </div>

            <div class="form-status" id="formStatus" role="status"></div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>
                <span class="btn-label">Log in</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>

            <p class="switch-link">
                Don't have an account? <a href="/pages/signup.html">Create one</a>
            </p>

        </form>
    </div>
</main>

<script src="/js/login.js"></script>
</body>
</html>
