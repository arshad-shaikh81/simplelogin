<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="page">
    <div class="card">

        <header class="card__header">
            <p class="eyebrow">Welcome back</p>
            <h1>Log in to your account</h1>
            <p class="subtitle">Enter your email and password to continue.</p>
        </header>

        <form id="loginForm" novalidate>

            <!-- EMAIL -->
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
                <span class="error" id="email-error" role="alert"></span>
            </div>

            <!-- PASSWORD -->
            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" />
                    <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <span class="error" id="password-error" role="alert"></span>
            </div>

            <p class="forgot-link">
                <a href="#" id="forgotPasswordLink">Forgot password?</a>
            </p>

            <div class="form-status" id="formStatus" role="status"></div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-label">Log in</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>

            <p class="switch-link">
                Don't have an account? <a href="signup.html">Create one</a>
            </p>

        </form>

        <!-- FORGOT PASSWORD PANEL (hidden by default) -->
        <div id="forgotPasswordPanel" class="forgot-panel" hidden>
            <h2>Reset your password</h2>
            <p class="subtitle">Enter your email and we'll send you a temporary password.</p>

            <div class="field">
                <label for="resetEmail">Email address</label>
                <input type="email" id="resetEmail" placeholder="you@example.com" />
                <span class="error" id="resetEmail-error" role="alert"></span>
            </div>

            <div class="form-status" id="resetStatus" role="status"></div>

            <button type="button" class="submit-btn" id="sendResetBtn">
                <span class="btn-label">Send temporary password</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>

            <p class="switch-link">
                <a href="#" id="backToLoginLink">Back to login</a>
            </p>
        </div>

    </div>
</main>

<script src="login.js"></script>
</body>
</html>
